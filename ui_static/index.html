<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Animator</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #6b7280; --line: #dfe2e7;
    --accent: #007aff; --accent-text: #ffffff; --ok: #1a8f4c; --err: #d93025; --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1c1e; --card: #26282b; --text: #ececec; --muted: #9aa0a6; --line: #3a3d41;
            --field: #1f2023; --ok: #4cc27d; --err: #ff6b60; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { padding: 16px 16px 130px; }
  h1 { font-size: 20px; margin: 4px 0 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .card > h2, summary { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
  details.card > summary { cursor: pointer; margin: 0; list-style-position: inside; }
  details.card[open] > summary { margin-bottom: 10px; }
  [hidden] { display: none !important; }
  .drops { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; min-height: 170px; display: flex; flex-direction: column;
          align-items: center; justify-content: center; text-align: center; padding: 10px; cursor: pointer;
          background: var(--card); position: relative; overflow: hidden; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--accent); background: rgba(0,122,255,.08); }
  .drop.ok { border-style: solid; border-color: var(--ok); }
  .drop img { max-width: 100%; max-height: 120px; border-radius: 6px; margin-bottom: 6px; }
  .drop .title { font-weight: 600; }
  .drop .sub { color: var(--muted); font-size: 12px; word-break: break-all; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 16px; }
  label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  label.f.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
  input[type=number], input[type=text], select { background: var(--field); color: var(--text); border: 1px solid var(--line);
          border-radius: 8px; padding: 6px 8px; font: inherit; width: 100%; }
  input[type=color] { width: 100%; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px; }
  .bar-in { display: flex; gap: 14px; align-items: center; }
  .progress { flex: 1; min-width: 0; }
  .track { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .fill.done { background: var(--ok); } .fill.err { background: var(--err); }
  .status { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--text);
           padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; padding: 9px 22px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .link { background: none; border: none; color: var(--accent); padding: 0 6px; }
  pre { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: 220px;
        overflow: auto; font-size: 11px; margin: 8px 0 0; white-space: pre-wrap; }
  .results div { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .results div:last-child { border-bottom: 0; }
  .results .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results .meta { color: var(--muted); font-size: 12px; }
  .msg { color: var(--err); font-size: 13px; margin-top: 8px; }
  .note { color: var(--ok); font-size: 13px; margin-top: 8px; }
  .total { font-size: 14px; font-weight: 600; margin-top: 10px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top .btns { display: flex; gap: 8px; }
  .style-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .style-row select { width: auto; min-width: 180px; flex: 1; max-width: 320px; }
  .style-row input[type=text] { width: auto; flex: 1; max-width: 260px; }
  .redraw-wrap { display: flex; gap: 16px; align-items: flex-start; }
  .redraw-main { flex: 1; min-width: 0; }
  .redraw-side { flex: 0 0 340px; position: sticky; top: 8px; }
  #preview { width: 340px; height: 80px; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .rangerow { display: flex; gap: 8px; align-items: center; }
  .rangerow input[type=range] { flex: 1; min-width: 0; }
  .rangerow input[type=number] { width: 72px; flex: none; }
  @media (max-width: 900px) { .redraw-wrap { flex-direction: column; } .redraw-side { position: static; } }
  @media (max-width: 640px) { .drops { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="top"><h1>Map Animator</h1>
    <div class="btns"><button id="lang" title="Language / Язык">RU</button><button id="reset" data-i18n="reset"></button></div></div>

  <div class="drops">
    <div class="drop" id="drop-clean" data-kind="clean"></div>
    <div class="drop" id="drop-track" data-kind="track"></div>
  </div>
  <div class="msg" id="img-msg"></div><div class="note" id="img-note"></div>
  <input type="file" id="file-input" accept="image/*" hidden>

  <div class="card" style="margin-top:12px">
    <h2 data-i18n="sec_main"></h2>
    <div class="grid" id="main-fields"></div>
    <div class="total" id="duration-total"></div>
    <div class="hint" id="duration-hint"></div>
  </div>

  <details class="card" id="sec-redraw" open><summary data-i18n="sec_redraw"></summary>
    <div class="redraw-wrap"><div class="redraw-main">
    <div class="style-row">
      <span class="hint" style="margin:0" data-i18n="style_label"></span>
      <select id="style-select"></select>
      <button id="style-save" data-i18n="style_save"></button>
      <button id="style-delete" data-i18n="style_delete" hidden></button>
    </div>
    <div class="style-row" id="style-form" hidden>
      <input type="text" id="style-name" maxlength="40">
      <button class="primary" id="style-ok" style="padding:7px 16px" data-i18n="style_ok"></button>
      <button id="style-cancel" data-i18n="style_cancel"></button>
    </div>
    <div class="note" id="style-note" style="margin:0 0 8px"></div>
    <div class="grid" id="redraw-fields"></div>
    </div><div class="redraw-side"><canvas id="preview"></canvas></div></div>
  </details>
  <details class="card" id="sec-reveal" open><summary data-i18n="sec_reveal"></summary><div class="grid" id="reveal-fields"></div>
    <div class="hint" data-i18n="reveal_hint"></div></details>
  <details class="card"><summary data-i18n="sec_detect"></summary><div class="grid" id="detect-fields"></div></details>

  <div class="card">
    <h2><span data-i18n="results"></span> <span style="font-weight:400;color:var(--muted)" data-i18n="results_folder"></span></h2>
    <div class="results" id="results"></div>
  </div>
  <details class="card" id="log-card"><summary data-i18n="log"></summary><pre id="log"></pre></details>
</main>

<div class="bar"><div class="bar-in">
  <button class="primary" id="go" disabled data-i18n="go"></button>
  <button id="cancel" style="display:none" data-i18n="cancel"></button>
  <div class="progress">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="status" id="status"></div>
  </div>
</div></div>

<script>
const TOKEN = "__TOKEN__";
const $ = (s) => document.querySelector(s);

// ================================================================ translations
const I18N = {
  ru: {
    reset: "Сбросить настройки", drop_clean: "Чистая карта", drop_track: "Карта с треком",
    drop_hint: "перетащите файл сюда или нажмите, чтобы выбрать", uploading: "загрузка…",
    sec_main: "Основное", sec_redraw: "Режим redraw: линия и маркеры", sec_reveal: "Режим reveal: кисти",
    sec_detect: "Поиск трека и маркеров (дополнительно)", reveal_hint: "Пустое поле = автоматически: кисть линии = толщина линии на картинке + запас, диск маркера = его реальный размер.",
    results: "Результаты", results_folder: "— папка output", results_empty: "Пока пусто", log: "Лог генерации",
    go: "Генерировать", cancel: "Отмена",
    f_mode: "Режим", mode_redraw: "redraw — перерисовать", mode_reveal: "reveal — проявить оригинал",

    f_quality: "Качество видео", q_max: "Максимальное (почти без потерь)", q_high: "Высокое", q_balanced: "Сбалансированное",
    res_map: "Как у карты (без кадрирования)", f_outline: "Обводка кружка, px (0 = нет)", f_outcol: "Цвет обводки",
    f_first: "Пауза до первого кружка, с", f_initial: "Пауза перед стартом движения, с", f_track: "Длительность движения по треку, с",
    f_wpause: "Пауза на точке, с", f_final: "Пауза в конце, с", f_pausewp: "Останавливаться на промежуточных точках",
    f_debug: "Сохранить debug-картинки (папка debug)",
    f_linecol: "Цвет линии", f_linethick: "Толщина линии, px", f_markcol: "Цвет кружка", f_textcol: "Цвет буквы", f_radius: "Радиус кружка, px",
    f_font: "Шрифт букв", font_default: "Стандартный (OpenCV)", f_fontthick: "Толщина шрифта", f_fontscale: "Размер шрифта (масштаб)",
    f_fontsize: "Размер шрифта, px", f_autoscale: "Подгонять размеры под картинку",
    f_brush: "Радиус кисти линии, px (пусто = авто)", f_margin: "Запас кисти к линии, px", f_wbrush: "Радиус диска маркера, px (пусто = авто)", auto: "авто",
    f_minr: "Мин. радиус кружка, px", f_hsvlo: "HSV нижняя граница (H, S, V)", f_hsvhi: "HSV верхняя граница (H, S, V)",
    f_spur: "Обрезка коротких ответвлений, px", f_sigma: "Сглаживание пути (sigma)", f_diff: "Порог разницы карт",
    style_label: "Стиль", style_custom: "— свой —", style_save: "Сохранить стиль", style_delete: "Удалить стиль",
    style_ok: "Сохранить", style_cancel: "Отмена", style_default_name: "Стиль {n}",
    style_exists: "Такой стиль уже сохранён: «{name}».", style_saved: "Стиль «{name}» сохранён.", style_updated: "Стиль «{name}» обновлён.",
    style_deleted: "Стиль «{name}» удалён.",
    st_add: "Добавьте обе карты, чтобы начать", st_ready: "Готово к генерации", st_fix: "Исправьте карты, чтобы продолжить",
    st_check: "Проверяю карты…", st_stage: "Этап {n}/5: {text} · прошло {el}", st_render: "Рендер {pct}% · прошло {el} · осталось ≈ {eta}",
    st_done: "Готово за {el} — {video} (папка открыта в Finder)", st_cancelled: "Отменено", st_error: "Ошибка: {msg}",
    note_swapped: "Карты были перепутаны местами: трек нашёлся на «чистой» карте. Поменял их местами автоматически.", note_markers: "Найдено кружков: {n}.",
    err_need_both: "Сначала загрузите обе карты.", err_sizes_differ: "Размеры карт не совпадают: {w1}×{h1} и {w2}×{h2}.",
    err_no_track: "На карте с треком не найден синий трек: карты одинаковые или трек не синий. Проверьте, что загружены нужные файлы.",
    err_maps_mismatch: "Карты не совпадают: {percent}% картинки отличается вне трека. Это разные изображения или карта сделана со сдвигом/масштабом.",
    err_swapped: "Карты перепутаны: трек нарисован на «чистой» карте.", err_running: "Генерация уже идёт.", err_file_missing: "Файл не найден.",
    err_too_large: "Файл слишком большой.", err_not_image: "Нужен файл изображения (jpg, png, …).", err_read_fail: "Не удалось прочитать изображение.",
    dur_total: "Полная длительность видео: {total} с = {first} (до кружка) + {init} (перед стартом) + {track} (движение){wp} + {final} (финал)",
    dur_wp: " + {n} × {p} (паузы на промежуточных точках)", dur_unknown: "Полная длительность видео станет известна после загрузки карт (нужно знать число точек).",
    dur_min: "Минимальная длительность видео ≈ {base} с", dur_min_wp: " + {p} с на каждую промежуточную точку",
    reveal_btn: "Показать в Finder", open_btn: "Открыть", mb: "МБ", sec: "с", min: "мин",
  },
  en: {
    reset: "Reset settings", drop_clean: "Clean map", drop_track: "Map with track",
    drop_hint: "drop a file here or click to choose", uploading: "uploading…",
    sec_main: "General", sec_redraw: "Redraw mode: line and markers", sec_reveal: "Reveal mode: brushes",
    sec_detect: "Track and marker detection (advanced)", reveal_hint: "Empty = automatic: line brush = the line's width on the picture + margin, marker disc = its real size.",
    results: "Results", results_folder: "— output folder", results_empty: "Nothing yet", log: "Generation log",
    go: "Generate", cancel: "Cancel",
    f_mode: "Mode", mode_redraw: "redraw — draw anew", mode_reveal: "reveal — uncover the original",
    f_fps: "FPS (frames per second)", f_res: "Video resolution (16:9)", res_native: "Original scale, 16:9 frame",
    res_hint: "A 16:9 frame is cut out of the map around the track. “Same as the map” keeps the whole map.",
    f_codec: "Codec", codec_avc1: "H.264 — default, plays everywhere", codec_hvc1: "H.265 / HEVC — more compact, slower to encode", codec_mp4v: "MPEG-4 (mp4v) — old format",
    f_quality: "Video quality", q_max: "Maximum (near lossless)", q_high: "High", q_balanced: "Balanced",
    res_map: "Same as the map (no cropping)", f_outline: "Marker outline, px (0 = none)", f_outcol: "Outline colour",
    f_first: "Pause before the first marker, s", f_initial: "Pause before the movement starts, s", f_track: "Movement along the track, s",
    f_wpause: "Pause at a waypoint, s", f_final: "Pause at the end, s", f_pausewp: "Stop at intermediate waypoints",
    f_debug: "Save debug images (debug folder)",
    f_linecol: "Line colour", f_linethick: "Line thickness, px", f_markcol: "Marker colour", f_textcol: "Letter colour", f_radius: "Marker radius, px",
    f_font: "Letter font", font_default: "Default (OpenCV)", f_fontthick: "Font weight", f_fontscale: "Font size (scale)",
    f_fontsize: "Font size, px", f_autoscale: "Scale drawing to the image size",
    f_brush: "Line brush radius, px (empty = auto)", f_margin: "Brush margin over the line, px", f_wbrush: "Marker disc radius, px (empty = auto)", auto: "auto",
    f_minr: "Min. marker radius, px", f_hsvlo: "HSV lower bound (H, S, V)", f_hsvhi: "HSV upper bound (H, S, V)",
    f_spur: "Short branch pruning, px", f_sigma: "Path smoothing (sigma)", f_diff: "Map difference threshold",
    style_label: "Style", style_custom: "— custom —", style_save: "Save style", style_delete: "Delete style",
    style_ok: "Save", style_cancel: "Cancel", style_default_name: "Style {n}",
    style_exists: "This style is already saved: “{name}”.", style_saved: "Style “{name}” saved.", style_updated: "Style “{name}” updated.",
    style_deleted: "Style “{name}” deleted.",
    st_add: "Add both maps to start", st_ready: "Ready to generate", st_fix: "Fix the maps to continue",
    st_check: "Checking the maps…", st_stage: "Step {n}/5: {text} · elapsed {el}", st_render: "Rendering {pct}% · elapsed {el} · about {eta} left",
    st_done: "Done in {el} — {video} (folder opened in Finder)", st_cancelled: "Cancelled", st_error: "Error: {msg}",
    note_swapped: "The maps were swapped: the track was found on the “clean” map. They were swapped back automatically.", note_markers: "Markers found: {n}.",
    err_need_both: "Upload both maps first.", err_sizes_differ: "The maps have different sizes: {w1}×{h1} and {w2}×{h2}.",
    err_no_track: "No blue track found: the maps are identical or the track is not blue. Check that the right files are loaded.",
    err_maps_mismatch: "The maps do not match: {percent}% of the picture differs away from the track. They are different images, or one map was shifted/zoomed.",
    err_swapped: "The maps are swapped: the track is drawn on the “clean” map.", err_running: "A generation is already running.", err_file_missing: "File not found.",
    err_too_large: "The file is too large.", err_not_image: "An image file is required (jpg, png, …).", err_read_fail: "The image could not be read.",
    dur_total: "Total video length: {total} s = {first} (before marker) + {init} (before start) + {track} (movement){wp} + {final} (end)",
    dur_wp: " + {n} × {p} (waypoint pauses)", dur_unknown: "The total length will be known once the maps are loaded (the number of waypoints is needed).",
    dur_min: "Minimum video length ≈ {base} s", dur_min_wp: " + {p} s for each intermediate waypoint",
    reveal_btn: "Show in Finder", open_btn: "Open", mb: "MB", sec: "s", min: "min",
  },
};
let lang = (navigator.language || "en").toLowerCase().startsWith("ru") ? "ru" : "en";
const t = (key, args = {}) => (I18N[lang][key] ?? I18N.en[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => args[k] ?? "");
function applyI18n() {
  document.documentElement.lang = lang; $("#lang").textContent = lang.toUpperCase();
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
  $("#style-name").placeholder = t("style_default_name", {n: ""}).trim();
}
// errors from the server / script: translate by code, fall back to the English text
const errText = (e) => (e && e.code && I18N.en["err_" + e.code]) ? t("err_" + e.code, e.args || {}) : (e && e.message) || String(e);

// ================================================================ api
let defaults = null, cfg = null, styles = [], fonts = [], codecs = [];
const images = {clean: null, track: null};   // {id, width, height, name, url}
let pollTimer = null, logNext = 0, running = false, analysis = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {...(opts.headers || {}), "X-Token": TOKEN}});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || ("HTTP " + r.status)); e.code = data.code; e.args = data.args; throw e; }
  return data;
}
const post = (path, body) => api(path, {method: "POST", body: JSON.stringify(body || {})});

// ================================================================ config helpers
const get = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
function set(o, p, v) { const ks = p.split("."); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; }
const bgr2hex = ([b, g, r]) => "#" + [r, g, b].map(x => Math.max(0, Math.min(255, x)).toString(16).padStart(2, "0")).join("");
const hex2bgr = (h) => [parseInt(h.slice(5, 7), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(1, 3), 16)];
const fmtNum = (v) => (v == null || isNaN(v)) ? "" : String(Math.round(v * 1000) / 1000);   // 5.50 -> "5.5"

const FPS_OPTIONS = [24, 25, 30, 48, 50, 60];
const RES_PRESETS = [[2160, "4K (2160p)"], [1440, "1440p (2K)"], [1080, "1080p (Full HD)"], [720, "720p (HD)"], [480, "480p (SD)"]];
const evenDown = (n) => n - (n % 2);
function nativeFrame() {                    // largest 16:9 region of the map (same rule as the script)
  const im = images.clean || images.track; if (!im) return null;
  const ar = 16 / 9; let w = im.width, h = im.height;
  if (w / h > ar) w = Math.round(h * ar); else h = Math.round(w / ar);
  return [evenDown(w), evenDown(h)];
}
const resolutionFor = (h) => h ? [evenDown(Math.round(h * 16 / 9)), h] : null;

// field types: dec (decimal, comma or dot) | int | opt (empty = null) | bool | color | sel | vec3 | res | codec | fps
const MAIN = [
  {p: "mode", l: "f_mode", t: "sel", opts: [["redraw", "mode_redraw"], ["reveal", "mode_reveal"]]},
  {p: "output.fps", l: "f_fps", t: "fps"},
  {p: "__resPreset", l: "f_res", t: "res"},

// ================================================================ style preview (canvas)
let previewBg = null, previewBgUrl = null;
const WEIGHTS = {thin: 100, ultralight: 200, "ultra light": 200, extralight: 200, light: 300, book: 400, roman: 400, regular: 400, normal: 400, medium: 500,
  semibold: 600, "demi bold": 600, demibold: 600, bold: 700, extrabold: 800, ultrabold: 800, heavy: 900, black: 900, extrablack: 900};
function drawPreview() {
  const c = $("#preview"); if (!c || $("#sec-redraw").hidden) return;
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth || 340, H = 80;
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rs = cfg.redraw_settings;
  // same auto-scaling as the script: sizes follow the detected marker size
  let f = 1;
  if (rs.auto_scale_drawing && analysis && analysis.marker_radius) { const k = analysis.marker_radius / rs.marker_radius; if (Math.abs(k - 1) >= 0.15) f = k; }
  const r = rs.marker_radius * f, thick = rs.line_thickness * f;
  const family = rs.marker_font_family;
  const fontPx = (family ? rs.marker_font_size_px : rs.marker_font_scale * 29) * f;
  const outline = (rs.marker_outline_px || 0) * f;
  const Z = Math.min(3, Math.max(0.05, 26 / (r + outline)));                // marker is ~50 px wide in the preview
  const css = (bgr) => `rgb(${bgr[2]},${bgr[1]},${bgr[0]})`;
  // background: a piece of the loaded clean map (true scale) or a green map-like gradient
  const img = images.clean && images.clean.url;
  if (img && previewBgUrl !== img) { previewBgUrl = img; previewBg = new Image(); previewBg.onload = drawPreview; previewBg.src = img; }
  if (img && previewBg && previewBg.complete && previewBg.naturalWidth) {
    const sw = Math.min(previewBg.naturalWidth, W / Z), sh = Math.min(previewBg.naturalHeight, H / Z);
    g.drawImage(previewBg, previewBg.naturalWidth / 2 - sw / 2, previewBg.naturalHeight / 2 - sh / 2, sw, sh, 0, 0, sw * Z, sh * Z);
  } else {
    const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, "#d6f0e0"); gr.addColorStop(1, "#96cdaa"); g.fillStyle = gr; g.fillRect(0, 0, W, H);

  }

  g.beginPath(); g.moveTo(W * 0.06, H * 0.78); g.bezierCurveTo(W * 0.22, H * 1.0, W * 0.3, H * 0.5, W * 0.5, H * 0.5);

  g.fillStyle = css(rs.marker_color_bgr); g.beginPath(); g.arc(cx, cy, r * Z, 0, 7); g.fill();
  const style = (rs.marker_font_style || "regular").toLowerCase();
  const weight = family ? (WEIGHTS[style] || 400) : 600;
  g.font = `${weight} ${Math.max(4, fontPx * Z)}px ${family ? `"${family}", ` : ""}-apple-system, Helvetica, Arial, sans-serif`;
  g.fillStyle = css(rs.marker_text_color_bgr); g.textAlign = "left"; g.textBaseline = "alphabetic";
  const m = g.measureText("A");

}

function dropTwo(files) {   // two files dropped at once: the one with "track" in its name is the track map
  const arr = [...files]; let tr = arr.find(f => /track|трек/i.test(f.name)); let cl = arr.find(f => f !== tr);
  if (!tr) { cl = arr[0]; tr = arr[1]; }
  setImage("clean", cl); setImage("track", tr);
}
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files; if (f.length === 2) dropTwo(f); });

// ================================================================ run
const fmtTime = (s) => { s = Math.max(0, Math.round(s)); return s >= 60 ? `${Math.floor(s / 60)} ${t("min")} ${s % 60} ${t("sec")}` : `${s} ${t("sec")}`; };
function setRunning(on) { running = on; $("#go").style.display = on ? "none" : ""; $("#cancel").style.display = on ? "" : "none"; refreshGo(); }
function buildConfig() {
  const c = JSON.parse(JSON.stringify(cfg));
  const rp = cfg.__resPreset;                                   // -1 whole map, 0 original-scale 16:9 frame, else a height
  c.output.aspect = rp === -1 ? null : [16, 9];
  c.output.resolution = rp > 0 ? resolutionFor(rp) : null;
  Object.keys(c).filter(k => k.startsWith("__")).forEach(k => delete c[k]);
  return c;
}
async function generate() {
  $("#log").textContent = ""; logNext = 0;
  const fill = $("#fill"); fill.className = "fill"; fill.style.width = "0";
  const payload = {clean: images.clean.id, track: images.track.id, debug: !!cfg.__debug, config: buildConfig()};
  try { await post("/api/generate", payload); } catch (e) { $("#status").textContent = errText(e); fill.className = "fill err"; return; }
  setRunning(true); clearInterval(pollTimer); pollTimer = setInterval(poll, 400); poll();
}
async function poll() {
  let s; try { s = await api("/api/status?since=" + logNext); } catch (e) { return; }
  logNext = s.next;
  if (s.lines.length) { const pre = $("#log"); pre.textContent += s.lines.join("\n") + "\n"; pre.scrollTop = pre.scrollHeight; }
  const fill = $("#fill"); fill.style.width = s.percent + "%";
  if (s.state === "running") {
    $("#status").textContent = s.render_pct != null ? t("st_render", {pct: s.render_pct, el: fmtTime(s.elapsed), eta: fmtTime(s.eta)})
      : t("st_stage", {n: s.stage || 1, text: s.stage_text || "…", el: fmtTime(s.elapsed)});
    return;
  }
  clearInterval(pollTimer); setRunning(false);
  if (s.state === "done") { fill.className = "fill done"; $("#status").textContent = t("st_done", {el: fmtTime(s.elapsed), video: s.video}); }
  else if (s.state === "cancelled") { fill.className = "fill err"; fill.style.width = "0"; $("#status").textContent = t("st_cancelled"); }
  else if (s.state === "error") { fill.className = "fill err"; $("#status").textContent = t("st_error", {msg: s.error}); $("#log-card").open = true; }
  loadResults();
}
$("#go").onclick = generate;
$("#cancel").onclick = () => post("/api/cancel").catch(() => {});

// ================================================================ results
async function loadResults() {
  let list; try { list = await api("/api/outputs"); } catch (e) { return; }
  const box = $("#results"); box.innerHTML = "";
  if (!list.length) { box.append(mk("div", {className: "meta", textContent: t("results_empty")})); return; }
  list.forEach(it => {
    const row = mk("div");
    row.append(mk("span", {className: "name", textContent: it.name}),
      mk("span", {className: "meta", textContent: (it.size / 1048576).toFixed(1) + " " + t("mb") + " · " + new Date(it.mtime * 1000).toLocaleString(lang === "ru" ? "ru-RU" : "en-US")}),
      Object.assign(mk("button", {className: "link", textContent: t("reveal_btn")}), {onclick: () => post("/api/reveal", {name: it.name})}),
      Object.assign(mk("button", {className: "link", textContent: t("open_btn")}), {onclick: () => post("/api/reveal", {name: it.name, open: true})}));
    box.append(row);
  });
}

// ================================================================ persistence (server file + local copy)
let saveTimer = null;
function save() {
  const state = {cfg, lang, styles};
  try { localStorage.setItem("mapAnimatorState", JSON.stringify(state)); } catch (e) {}
  clearTimeout(saveTimer); saveTimer = setTimeout(() => post("/api/settings", state).catch(() => {}), 300);
}
function merge(base, over) {   // deep-merge saved settings over the defaults (unknown keys are dropped)
  const isObj = (x) => x && typeof x === "object" && !Array.isArray(x);
  if (!isObj(base) || !isObj(over)) return over === undefined ? base : over;
  const out = {...base};
  for (const k of Object.keys(base)) if (k in over) out[k] = merge(base[k], over[k]);
  return out;
}
function freshConfig() {
  const c = JSON.parse(JSON.stringify(defaults)); c.__debug = false; c.__resPreset = 0;
  c.redraw_settings.marker_font_family = c.redraw_settings.marker_font_family || ""; c.redraw_settings.marker_font_style = c.redraw_settings.marker_font_style || "";
  if (codecs.length && !codecs.some(x => x.value === c.output.codec)) c.output.codec = codecs[0].value;   // best codec this machine can encode
  return c;
}
$("#reset").onclick = () => { cfg = freshConfig(); save(); render(); };
$("#lang").onclick = () => { lang = lang === "ru" ? "en" : "ru"; applyI18n(); render(); showNote(); loadResults(); save(); };

// ================================================================ lifecycle
// Keep one connection open: when the window closes it breaks and the server shuts itself down.
async function keepAlive() {
  try { const r = await fetch("/api/alive", {headers: {"X-Token": TOKEN}}); const rd = r.body.getReader();
        while (!(await rd.read()).done) {} } catch (e) {}
  setTimeout(keepAlive, 1500);
}
keepAlive();

(async function init() {
  let saved = {};
  [defaults, fonts, codecs, saved] = await Promise.all([api("/api/defaults"), api("/api/fonts").catch(() => []), api("/api/codecs").catch(() => []), api("/api/settings").catch(() => ({}))]);
  if (!saved || !saved.cfg) { try { saved = JSON.parse(localStorage.getItem("mapAnimatorState") || "{}"); } catch (e) { saved = {}; } }
  cfg = freshConfig();
  if (saved.cfg) { cfg = merge(cfg, saved.cfg); if (saved.cfg.__resPreset != null) cfg.__resPreset = saved.cfg.__resPreset; }
  if (saved.lang === "ru" || saved.lang === "en") lang = saved.lang;
  styles = Array.isArray(saved.styles) ? saved.styles : [];
  applyI18n(); render(); loadResults();
  const s = await api("/api/status?since=0");   // a generation may already be running after a reload
  if (s.state === "running") { setRunning(true); pollTimer = setInterval(poll, 400); }
})();
</script>
</body>
