<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Animator</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #6b7280; --line: #dfe2e7;
    --accent: #007aff; --accent-text: #ffffff; --ok: #1a8f4c; --err: #d93025; --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1c1e; --card: #26282b; --text: #ececec; --muted: #9aa0a6; --line: #3a3d41;
            --field: #1f2023; --ok: #4cc27d; --err: #ff6b60; }
  }
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  /* Native controls look different on every macOS version (gradients on older ones). Draw our own. */
  select, button, input[type=text], input[type=number], input[type=color], input[type=range], input[type=checkbox] {
    -webkit-appearance: none; appearance: none; }
  button { background-image: none; box-shadow: none; }
  input[type=checkbox] { width: 18px; height: 18px; flex: none; border: 1.5px solid var(--line); border-radius: 5px; background-color: var(--field);
    position: relative; cursor: pointer; padding: 0; }
  input[type=checkbox]:checked { background-color: var(--accent); border-color: var(--accent); }
  input[type=checkbox]:checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  input[type=range] { height: 22px; background: transparent; padding: 0; border: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; margin-top: -6px;
    border-radius: 50%; background: #fff; border: 1px solid rgba(0,0,0,.25); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  input[type=color] { padding: 3px; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 6px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { padding: 16px 16px 130px; }
  h1 { font-size: 20px; margin: 4px 0 14px; }
  h1 .ver { color: var(--muted); font-weight: 400; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .card > h2, summary { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
  details.card > summary { cursor: pointer; margin: 0; list-style-position: inside; }
  details.card[open] > summary { margin-bottom: 10px; }
  [hidden] { display: none !important; }
  .drops { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; min-height: 170px; display: flex; flex-direction: column;
          align-items: center; justify-content: center; text-align: center; padding: 10px; cursor: pointer;
          background: var(--card); position: relative; overflow: hidden; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--accent); background: rgba(0,122,255,.08); }
  .drop.ok { border-style: solid; border-color: var(--ok); }
  .drop img { max-width: 100%; max-height: 120px; border-radius: 6px; margin-bottom: 6px; }
  .drop .title { font-weight: 600; }
  .drop .sub { color: var(--muted); font-size: 12px; word-break: break-all; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 16px; }
  label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  label.f.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
  input[type=number], input[type=text], select { background: var(--field); color: var(--text); border: 1px solid var(--line);
          border-radius: 8px; padding: 6px 8px; font: inherit; width: 100%; }
  input[type=color] { width: 100%; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px; }
  .bar-in { display: flex; gap: 14px; align-items: center; }
  .progress { flex: 1; min-width: 0; }
  .track { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .fill.done { background: var(--ok); } .fill.err { background: var(--err); }
  .status { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--text);
           padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; padding: 9px 22px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .link { background: none; border: none; color: var(--accent); padding: 0 6px; }
  pre { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: 220px;
        overflow: auto; font-size: 11px; margin: 8px 0 0; white-space: pre-wrap; }
  .results div { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .results div:last-child { border-bottom: 0; }
  .results .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results .meta { color: var(--muted); font-size: 12px; }
  .msg { color: var(--err); font-size: 13px; margin-top: 8px; }
  .note { color: var(--ok); font-size: 13px; margin-top: 8px; }
  .total { font-size: 14px; font-weight: 600; margin-top: 10px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top .btns { display: flex; gap: 8px; }
  .zoom { display: inline-flex; gap: 0; } .zoom button { border-radius: 0; padding: 7px 10px; } .zoom button:first-child { border-radius: 8px 0 0 8px; } .zoom button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  .style-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .style-row select { width: auto; min-width: 180px; flex: 1; max-width: 320px; }
  .style-row input[type=text] { width: auto; flex: 1; max-width: 260px; }
  #preview { width: 510px; max-width: 100%; height: 80px; border-radius: 10px; border: 1px solid var(--line); display: block; margin: 0 auto 12px; }
  .rangerow { display: flex; gap: 8px; align-items: center; }
  .rangerow input[type=range] { flex: 1; min-width: 0; }
  .rangerow input[type=number] { width: 72px; flex: none; }

  .prev-stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; }
  #prev-canvas { width: 100%; height: auto; display: block; min-height: 120px; }
  .prev-busy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ddd; background: rgba(0,0,0,.55); font-size: 14px; }
  .clear-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  button.danger { color: var(--err); border-color: var(--err); background: transparent; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; }
  .modal-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .modal-top .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #p-video { width: 100%; max-height: 62vh; background: #000; border-radius: 8px; display: block; cursor: pointer; }
  .pctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pctrl input[type=range] { flex: 1; min-width: 160px; }
  .pctrl .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 96px; text-align: center; }
  .pctrl select { width: auto; }
  .pctrl button { padding: 6px 12px; }
  @media (max-width: 640px) { .drops { grid-template-columns: 1fr; } }
  /* the arrow must come after the generic field rule, which sets `background:` */
  select { padding-right: 30px; background-repeat: no-repeat; background-position: right 11px center; background-size: 11px 7px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%238a8f98' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/></svg>"); }
  .segbar { position: relative; display: flex; height: 36px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); gap: 1px; background: var(--line); }
  .segbar > .blk { display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; overflow: hidden; white-space: nowrap; min-width: 8px; user-select: none; }
  .seg-handle { position: absolute; top: 0; bottom: 0; width: 14px; margin-left: -7px; cursor: col-resize; z-index: 2; touch-action: none; }
  .seg-handle::after { content: ""; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: rgba(255,255,255,.92); box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
  .seg-handle:hover::after, .seg-handle.drag::after { background: #fff; top: 3px; bottom: 3px; width: 4px; margin-left: -2px; }
  #seg-tip { position: fixed; z-index: 60; pointer-events: none; background: #111; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .stp { display: flex; align-items: center; gap: 4px; } .stp input { width: 72px; flex: none; }
  .stp .arr { display: flex; flex-direction: column; gap: 2px; } .stp .arr button { padding: 0; width: 22px; height: 15px; font-size: 8px; line-height: 1; border-radius: 5px; }
  .seg-leg { background: var(--accent); } .seg-pause { background: #f59e0b; } .seg-edge { background: #8a8f98; } .seg-start { background: #5ac8fa; }
  .seglegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .seglegend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .segrows { display: grid; grid-template-columns: minmax(160px, 1.2fr) 112px minmax(150px, 1fr) auto; gap: 6px 12px; align-items: center; max-height: 42vh; overflow: auto; padding-right: 4px; }
  .segrows .lab { font-size: 13px; } .segrows .lab.leg { font-weight: 600; } .segrows .info { font-size: 12px; color: var(--muted); }
  .segrows .sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 2px 0; }
  .segrows button { padding: 4px 9px; font-size: 12px; } .segrows .btns { display: flex; gap: 6px; }
  .segrows.off { opacity: .55; }
  .stp.ovr input { border-color: var(--accent); }
  .segbar > .blk.movable { cursor: grab; } .segbar > .blk.movable:hover { filter: brightness(1.12); }
  .segrows .ovrbtn { padding: 2px 8px; }

  .emoji-choice { display:flex; align-items:center; gap:10px; min-height:42px; }
  .emoji-choice img, .emoji-cell img { object-fit:contain; }
  .emoji-categories { display:flex; gap:6px; overflow-x:auto; padding:4px 0 10px; flex:none; }
  .emoji-categories button { flex:none; white-space:nowrap; }
  .emoji-categories button[aria-pressed=true] { background:var(--accent); color:var(--accent-text); }
  .emoji-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:6px; overflow-y:auto; min-height:180px; max-height:48vh; padding:4px; align-content:start; }
  .emoji-cell { height:52px; padding:6px; display:flex; align-items:center; justify-content:center; }
  .emoji-cell[aria-pressed=true] { border:2px solid var(--accent); }
  #emoji-picker .modal-card { width:min(880px,100%); }
  #emoji-search { flex:none; margin:10px 0; }
  #emoji-count { margin:4px 0; }
</style>
</head>
<body>
<main>
  <div class="top"><h1>Map Animator <span class="ver">(__VERSION__)</span></h1>
    <div class="btns"><span class="zoom"><button id="z-out" title="⌘ −">A−</button><button id="z-in" title="⌘ +" style="font-weight:600">A+</button></span><button id="lang" title="Language / Язык">RU</button><button id="docs-btn" data-i18n="docs"></button><button id="diag-btn" data-i18n="diag_btn"></button><button id="reset" data-i18n="reset"></button></div></div>

  <div class="drops">
    <div class="drop" id="drop-clean" data-kind="clean"></div>
    <div class="drop" id="drop-track" data-kind="track"></div>
  </div>
  <div class="msg" id="img-msg"></div><div class="note" id="img-note"></div>
  <input type="file" id="file-input" accept="image/*" hidden>

  <div class="card" style="margin-top:12px">
    <h2 data-i18n="sec_main"></h2>
    <div class="grid" id="main-fields"></div>
    <div class="total" id="duration-total"></div>
    <div class="hint" id="duration-hint"></div>
    <div class="clear-row"><button id="seg-btn" disabled data-i18n="seg_btn"></button><span class="hint" id="seg-note" style="margin:0"></span></div>
  </div>

  <details class="card" id="sec-redraw" open><summary data-i18n="sec_redraw"></summary>
    <canvas id="preview"></canvas>
    <div class="style-row">
      <span class="hint" style="margin:0" data-i18n="style_label"></span>
      <select id="style-select"></select>
      <button id="style-save" data-i18n="style_save"></button>
      <button id="style-delete" data-i18n="style_delete" hidden></button>
    </div>
    <div class="style-row" id="style-form" hidden>
      <input type="text" id="style-name" maxlength="40">
      <button class="primary" id="style-ok" style="padding:7px 16px" data-i18n="style_ok"></button>
      <button id="style-cancel" data-i18n="style_cancel"></button>
    </div>
    <div class="note" id="style-note" style="margin:0 0 8px"></div>
    <div class="grid" id="redraw-fields"></div>
  </details>
  <details class="card" id="sec-reveal" open><summary data-i18n="sec_reveal"></summary><div class="grid" id="reveal-fields"></div>
    <div class="hint" data-i18n="reveal_hint"></div></details>
  <details class="card"><summary data-i18n="sec_detect"></summary><div class="grid" id="detect-fields"></div></details>

  <div class="card">
    <h2><span data-i18n="results"></span> <span style="font-weight:400;color:var(--muted)" data-i18n="results_folder"></span></h2>
    <div class="results" id="results"></div>
    <div class="clear-row"><button id="clear-btn" class="danger" data-i18n="clear_btn"></button>
      <span id="clear-ask" hidden><span data-i18n="clear_ask"></span> <button id="clear-yes" class="danger" data-i18n="clear_yes"></button> <button id="clear-no" data-i18n="style_cancel"></button></span>
      <span class="hint" id="clear-note" style="margin:0"></span></div>
  </div>
  <details class="card" id="log-card"><summary data-i18n="log"></summary><pre id="log"></pre></details>
</main>

<div class="modal" id="player" hidden>
  <div class="modal-card">
    <div class="modal-top"><span class="name" id="p-title"></span><button id="p-close" aria-label="close">✕</button></div>
    <video id="p-video" preload="metadata" playsinline></video>
    <div class="msg" id="p-err" hidden></div>
    <div class="pctrl">
      <button id="p-play" class="primary" style="padding:6px 16px">▶</button>
      <input type="range" id="p-seek" min="0" max="10000" step="any" value="0">
      <span class="time" id="p-time">0:00 / 0:00</span>
      <select id="p-speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <button id="p-finder" data-i18n="reveal_btn"></button><button id="p-external" data-i18n="open_btn"></button><button id="p-delete" class="danger" data-i18n="delete_btn"></button>
    </div>
  </div>
</div>

<div class="modal" id="seg" hidden>
  <div class="modal-card">
    <div class="modal-top"><span class="name" data-i18n="seg_title"></span><button id="seg-close" aria-label="close">✕</button></div>
    <label class="f check"><input type="checkbox" id="seg-enabled"><span data-i18n="seg_use"></span></label>
    <div class="hint" style="margin:0" data-i18n="seg_hint"></div>
    <div class="hint" style="margin:0" data-i18n="seg_drag"></div>
    <div class="segbar" id="seg-bar"></div>
    <div class="seglegend"><span><i class="seg-edge"></i><span data-i18n="seg_lg_edge"></span></span><span><i class="seg-start"></i><span data-i18n="seg_lg_start"></span></span><span><i class="seg-leg"></i><span data-i18n="seg_lg_leg"></span></span><span><i class="seg-pause"></i><span data-i18n="seg_lg_pause"></span></span></div>
    <div class="total" id="seg-total" style="margin:0"></div>
    <div class="segrows" id="seg-rows"></div>
    <div class="pctrl"><button id="seg-reset" data-i18n="seg_reset"></button><button id="seg-restore" data-i18n="seg_restore" hidden></button><span style="flex:1"></span><button class="primary" id="seg-done" data-i18n="seg_done"></button></div>
  </div>
</div>

<div class="modal" id="diag" hidden>
  <div class="modal-card">
    <div class="modal-top"><span class="name" data-i18n="diag_title"></span><button id="diag-close" aria-label="close">✕</button></div>
    <div class="hint" style="margin:0" id="diag-where"></div>
    <textarea id="diag-text" readonly spellcheck="false" style="width:100%; height:46vh; font: 11px/1.4 ui-monospace, Menlo, monospace; background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px"></textarea>
    <div class="pctrl"><button class="primary" id="diag-copy" data-i18n="diag_copy"></button><span class="hint" id="diag-copied" style="margin:0"></span></div>
  </div>
</div>

<div class="modal" id="prev" hidden>
  <div class="modal-card">
    <div class="modal-top"><span class="name" data-i18n="prev_title"></span><button id="prev-close" aria-label="close">✕</button></div>
    <div class="prev-stage"><canvas id="prev-canvas" width="960" height="540"></canvas><div class="prev-busy" id="prev-busy"></div></div>
    <div class="msg" id="prev-err" hidden></div>
    <div class="pctrl">
      <button id="prev-play" class="primary" style="padding:6px 16px">▶</button>
      <input type="range" id="prev-seek" min="0" max="10000" step="any" value="0">
      <span class="time" id="prev-time">0:00 / 0:00</span>
      <select id="prev-speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <button id="prev-gen" class="primary" data-i18n="go"></button>
    </div>
    <div class="hint" style="margin:0" data-i18n="prev_hint"></div>
  </div>
</div>

<div class="bar"><div class="bar-in">
  <button id="preview-btn" disabled data-i18n="preview_btn"></button>
  <button class="primary" id="go" disabled data-i18n="go"></button>
  <button id="cancel" style="display:none" data-i18n="cancel"></button>
  <div class="progress">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="status" id="status"></div>
  </div>
</div></div>

<div class="modal" id="emoji-picker" hidden role="dialog" aria-modal="true" aria-labelledby="emoji-title">
  <div class="modal-card">
    <div class="modal-top"><strong id="emoji-title"></strong><button id="emoji-close" type="button" data-i18n="emoji_close"></button></div>
    <input id="emoji-search" type="search" autocomplete="off">
    <div id="emoji-categories" class="emoji-categories" role="group"></div>
    <div id="emoji-count" class="hint" role="status"></div>
    <div id="emoji-grid" class="emoji-grid" role="group"></div>
    <button id="emoji-more" type="button" data-i18n="emoji_more" hidden></button>
  </div>
</div>
<script>
const TOKEN = "__TOKEN__";
const JS_ERRORS = [];                         // shown in the diagnostics report
window.addEventListener("error", (e) => JS_ERRORS.push(`${e.message} (${(e.filename || "").split("/").pop()}:${e.lineno})`));
window.addEventListener("unhandledrejection", (e) => JS_ERRORS.push("promise: " + ((e.reason && e.reason.message) || e.reason)));
const $ = (s) => document.querySelector(s);

// ================================================================ translations
const I18N = {
  ru: {

function applyI18n() {
  document.documentElement.lang = lang; $("#lang").textContent = lang.toUpperCase();

}

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {...(opts.headers || {}), "X-Token": TOKEN}});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || ("HTTP " + r.status)); e.code = data.code; e.args = data.args; throw e; }
  return data;
}
const post = (path, body) => api(path, {method: "POST", body: JSON.stringify(body || {})});

function mk(tag, props = {}, ...kids) { const e = document.createElement(tag); Object.assign(e, props); kids.forEach(k => e.append(k)); return e; }
function labelWrap(text, control, check = false) {

}
function numInput(f, v) {

  i.value = v ?? ""; return i;
}
// text input that accepts "1,5" and "1.5" and tidies the number when you leave the field
function decInput(f, v, onValue) {
  const i = mk("input", {type: "text"}); i.inputMode = "decimal"; i.value = fmtNum(v);
  let last = v;
  i.addEventListener("input", () => {
    const pos = i.selectionStart;
    const clean = i.value.replace(/,/g, ".").replace(/[^0-9.]/g, "").replace(/^(\d*\.\d*).*$/, (m, a) => a);
    if (clean !== i.value) { i.value = clean; try { i.setSelectionRange(pos, pos); } catch (e) {} }
    const n = parseFloat(clean);

    else { let n = parseFloat(i.value); if (f.min != null) n = Math.max(f.min, n); i.value = fmtNum(n); last = n; onValue(n); }
  });

}
function selectOf(options, value, onChange) {

  s.value = value; s.onchange = () => onChange(s.value); return s;
}

function endpointImageField(f, value) {
  const input = mk("input", {type: "file", accept: "image/png,image/jpeg,image/webp"});
  const box = labelWrap(t(f.l), input);
  const note = mk("span", {className: "hint", textContent: t("icon_image_hint")});
  box.append(note);
  if (value) { const img = mk("img", {src: value, alt: t(f.l)}); img.style.cssText = "width:48px;height:48px;object-fit:contain"; box.append(img); }
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    try {
      if (file.size > 2 * 1024 * 1024 || !["image/png", "image/jpeg", "image/webp"].includes(file.type)) throw new Error();
      const url = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); });
      const img = await new Promise((resolve, reject) => { const image = new Image(); image.onload = () => resolve(image); image.onerror = reject; image.src = url; });
      if (!img.naturalWidth || !img.naturalHeight || Math.max(img.naturalWidth, img.naturalHeight) > 4096) throw new Error();
      const ratio = Math.min(1, 256 / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement("canvas"); canvas.width = Math.max(1, Math.round(img.naturalWidth * ratio)); canvas.height = Math.max(1, Math.round(img.naturalHeight * ratio));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      set(cfg, f.p, canvas.toDataURL("image/png")); renderRedraw(); changed();
    } catch (e) { note.textContent = t("icon_image_error"); input.value = ""; }
  };
  return box;
}

function field(f) {
  const val = get(cfg, f.p), label = t(f.l);

  if (f.t === "image") return endpointImageField(f, val);
  if (f.t === "endpoint") return labelWrap(label, selectOf(f.opts.map(([v, k]) => [v, t(k)]), val, v => { set(cfg, f.p, v); renderRedraw(); changed(); }));
  if (f.t === "sel") return labelWrap(label, selectOf(f.opts.map(([v, k]) => [v, t(k)]), val, (v) => { set(cfg, f.p, v); changed(f.p === "mode"); }));
  if (f.t === "fps") {
    const opts = FPS_OPTIONS.includes(val) ? FPS_OPTIONS : [...FPS_OPTIONS, val].sort((a, b) => a - b);
    return labelWrap(label, selectOf(opts.map(v => [v, String(v)]), val, (v) => { set(cfg, f.p, Number(v)); changed(); }));
  }
  if (f.t === "codec") {
    const opts = codecs.map(c => [c.value, t("codec_" + c.value)]);
    if (!codecs.some(c => c.value === val)) opts.push([val, val]);
    return labelWrap(label, selectOf(opts, val, (v) => { set(cfg, f.p, v); changed(); }));
  }
  if (f.t === "res") {
    const nf = nativeFrame(), im = images.clean || images.track;
    const opts = [["-1", t("res_map") + (im ? ` — ${evenDown(im.width)}×${evenDown(im.height)}` : "")],
                  ["0", t("res_native") + (nf ? ` — ${nf[0]}×${nf[1]}` : "")]];
    RES_PRESETS.forEach(([h, name]) => { const r = resolutionFor(h); opts.push([String(h), `${name} — ${r[0]}×${r[1]}`]); });
    const w = labelWrap(label, selectOf(opts, String(val || 0), (v) => { set(cfg, f.p, Number(v)); changed(); }));
    w.append(mk("span", {className: "hint", textContent: t("res_hint")})); return w;
  }
  if (f.t === "bool") {
    const c = mk("input", {type: "checkbox", checked: !!val}); c.onchange = () => { set(cfg, f.p, c.checked); changed(); };
    return labelWrap(label, c, true);
  }

    return labelWrap(label, c);

    const row = mk("div", {className: "rangerow"});
    const r = mk("input", {type: "range", min: f.min, max: f.max, step: 1, value: val});
    const n = numInput(f, val);
    const apply = (v, src) => { v = Math.max(f.min, Number(v) || 0); set(cfg, f.p, v); if (src !== r) r.value = v; if (src !== n) n.value = v; changed(); };
    r.oninput = () => apply(r.value, r); n.oninput = () => { if (n.value !== "") apply(n.value, n); };
    row.append(r, n); const w = mk("label", {className: "f"}); w.append(mk("span", {textContent: label}), row); return w;
  }
  if (f.t === "dec") return labelWrap(label, decInput(f, val, (n) => { set(cfg, f.p, n); changed(); }));
  if (f.t === "opt") {
    const i = numInput(f, val); i.placeholder = t("auto");
    i.oninput = () => { set(cfg, f.p, i.value === "" ? null : Number(i.value)); changed(); }; return labelWrap(label, i);
  }
  if (f.t === "vec3") {
    const row = mk("div", {className: "row3"});
    [0, 1, 2].forEach(k => { const i = numInput({min: 0, max: k === 0 ? 179 : 255}, val[k]);
      i.oninput = () => { get(cfg, f.p)[k] = Number(i.value); changed(); }; row.append(i); });
    const w = mk("label", {className: "f"}); w.append(mk("span", {textContent: label}), row); return w;
  }
  const i = numInput(f, val); i.oninput = () => { if (i.value !== "") { set(cfg, f.p, Number(i.value)); changed(); } };
  return labelWrap(label, i);
}

function normalizeEndpointChoices(settings) {

    if (Object.prototype.hasOwnProperty.call(legacy, old)) {

}

  L.push("== Fonts in the page", "  /api/fonts now: " + fr, "  first load error: " + (FONT_ERROR || "none"), "  families in the form: " + fonts.map(f => f.family).join(", "),
    "  chosen: " + JSON.stringify({family: rs.marker_font_family, style: rs.marker_font_style, path: rs.marker_font_path, size_px: rs.marker_font_size_px, scale: rs.marker_font_scale}));
  if (sel) { const cs = getComputedStyle(sel); L.push("== Look", `  select: appearance=${cs.appearance || cs.webkitAppearance}, background-image=${cs.backgroundImage.slice(0, 30)}`); }
  L.push("== State", `  mode ${cfg.mode} | maps loaded: ${!!images.clean}/${!!images.track} | analysis: ${analysis ? JSON.stringify(analysis).slice(0, 120) : "none"}`);
  return L.join("\n");
}
$("#diag-btn").onclick = async () => {
  $("#diag").hidden = false; $("#diag-text").value = "…"; $("#diag-copied").textContent = ""; $("#diag-where").textContent = "";
  let server = "(server report unavailable)";
  try { server = (await api("/api/diagnostics")).text; } catch (e) { server = "(server report failed: " + e.message + ")"; }
  const text = server + "\n\n" + await clientReport();
  $("#diag-text").value = text;
  try { const r = await post("/api/diagnostics", {text}); $("#diag-where").textContent = t("diag_saved", {path: r.path}); } catch (e) {}
};
$("#diag-copy").onclick = async () => {
  const ta = $("#diag-text"); ta.select();
  try { await navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand("copy"); }
  $("#diag-copied").textContent = t("diag_copied");
};
$("#diag-close").onclick = () => { $("#diag").hidden = true; };
$("#diag").addEventListener("click", (e) => { if (e.target.id === "diag") $("#diag").hidden = true; });

// ================================================================ lifecycle
// Keep one connection open: when the window closes it breaks and the server shuts itself down.
async function keepAlive() {
  try { const r = await fetch("/api/alive", {headers: {"X-Token": TOKEN}}); const rd = r.body.getReader();
        while (!(await rd.read()).done) {} } catch (e) {}
  setTimeout(keepAlive, 1500);
}
keepAlive();

(async function init() {
  let saved = {};
  [defaults, fonts, codecs, saved, emojiCatalog] = await Promise.all([api("/api/defaults"), api("/api/fonts").catch((e) => { FONT_ERROR = e.message || String(e); return []; }), api("/api/codecs").catch(() => []), api("/api/settings").catch(() => ({})), api("/api/emojis").catch(() => null)]);
  if (!saved || !saved.cfg) { try { saved = JSON.parse(localStorage.getItem("mapAnimatorState") || "{}"); } catch (e) { saved = {}; } }
  cfg = freshConfig();
  if (saved.cfg) { cfg = merge(cfg, saved.cfg); if (saved.cfg.__resPreset != null) cfg.__resPreset = saved.cfg.__resPreset; }
  normalizeFont(cfg);
  cfg.timing.custom = {enabled: false, legs: [], pauses: []};       // own times belong to one pair of maps: never carried over silently
  lastCustom = saved.lastCustom || null;
  if (saved.lang === "ru" || saved.lang === "en") lang = saved.lang;
  if (cfg.mode === "traveler") cfg.mode = "follow";
  styles = Array.isArray(saved.styles) ? saved.styles : [];
  if (typeof saved.uiScale === "number") { uiScale = saved.uiScale; document.body.style.zoom = uiScale; $("#z-out").disabled = uiScale <= 0.8; $("#z-in").disabled = uiScale >= 1.8; }
  applyI18n(); render(); loadResults();
  const s = await api("/api/status?since=0");   // a generation may already be running after a reload
  if (s.state === "running") { setRunning(true); pollTimer = setInterval(poll, 400); }
})();
</script>
